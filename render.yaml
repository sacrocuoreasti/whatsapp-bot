services:
  - type: web
    name: sacrocuore-whatsapp-bot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: whatsapp-data
      mountPath: /opt/render/project/src/baileys_auth_info
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
